services:
  # API: только принимает запросы и отдаёт 202. Воркер внутри этого процесса
  # запрещён (WORKER_IN_API=false) — задачи выполняет сервис worker.
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      STORAGE_ROOT: /data
      DB_DRIVER: postgres
      DATABASE_URL: postgres://projectx:projectx@postgres:5432/projectx
      QUEUE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      WORKER_IN_API: 'false'
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - cover-output:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # Воркер: тот же образ, но выполняет задачи и не принимает HTTP.
  worker:
    build: .
    command: ['node', 'src/worker.js']
    environment:
      STORAGE_ROOT: /data
      DB_DRIVER: postgres
      DATABASE_URL: postgres://projectx:projectx@postgres:5432/projectx
      QUEUE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    deploy:
      replicas: 3
    volumes:
      - cover-output:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # ML-сервис: замена лица. Инференс идёт на fal.ai,
  # локально считается только маска лица.
  ml-service:
    build: ./ml-service
    ports:
      - '8000:8000'
    environment:
      ML_ENV: production
      ML_LOG_JSON: ${ML_LOG_JSON:-false}
      ML_HOST: 0.0.0.0
      ML_PORT: '8000'
      ML_ALLOWED_ORIGINS: http://localhost:3000
      FAL_KEY: ${FAL_KEY:-}
      ML_REFINE_PROFILE: ${ML_REFINE_PROFILE:-pixar_real}
      ML_REFINE_STRENGTH: ${ML_REFINE_STRENGTH:-}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectx
      POSTGRES_PASSWORD: projectx
      POSTGRES_DB: projectx
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectx -d projectx']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cover-output:
  postgres-data:
  redis-data:
