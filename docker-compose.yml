services:
  # API: только принимает запросы и отдаёт 202. Воркер внутри этого процесса
  # запрещён (WORKER_IN_API=false) — задачи выполняет сервис worker.
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-mock}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-mock}
      AI_TEXT_BASE_URL: ${AI_TEXT_BASE_URL:-http://host.docker.internal:8080}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-local-model}
      STORAGE_ROOT: /data
      # Полная автономность: заказы в Postgres, задачи в Redis
      DB_DRIVER: postgres
      DATABASE_URL: postgres://projectx:projectx@postgres:5432/projectx
      QUEUE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      WORKER_IN_API: 'false'
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - book-output:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Воркер: тот же образ, но выполняет задачи и не принимает HTTP.
  # Масштабируется независимо: docker compose up -d --scale worker=3
  worker:
    build: .
    command: ['node', 'src/worker.js']
    environment:
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-mock}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-mock}
      AI_TEXT_BASE_URL: ${AI_TEXT_BASE_URL:-http://host.docker.internal:8080}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-local-model}
      STORAGE_ROOT: /data
      DB_DRIVER: postgres
      DATABASE_URL: postgres://projectx:projectx@postgres:5432/projectx
      QUEUE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - book-output:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectx
      POSTGRES_PASSWORD: projectx
      POSTGRES_DB: projectx
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectx -d projectx']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  book-output:
  postgres-data:
  redis-data:
