[project]
name = "projectx-ml-service"
version = "0.1.0"
description = "Face-swap ML-микросервис для сервиса генерации книг"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 — вызов в значении по умолчанию: базовый идиом FastAPI (File/Form/Depends)
ignore = ["B008"]
